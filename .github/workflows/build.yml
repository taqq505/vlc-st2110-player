name: Build

# Manual only: this project is developed on a machine without local build
# tools, so builds are driven from here on demand rather than on every push.
on:
  workflow_dispatch:

jobs:
  lint-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luac
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax-check the extension
        run: luac5.1 -p src/st2110_sdp_loader.lua

  build-receive-module:
    runs-on: ubuntu-22.04   # pinned: newer Ubuntu may ship VLC 4.x headers
    steps:
      - uses: actions/checkout@v4
      - name: Install VLC plugin SDK
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libvlccore-dev
      - name: Build
        working-directory: receive-module
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: vlc-st2110-linux
          path: receive-module/libst2110_plugin.so

  build-receive-module-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install VLC 3.0.16 (for libvlccore.dll)
        run: choco install vlc --version=3.0.16 -y

      - name: Fetch matching VLC 3.0.16 headers
        run: |
          git clone --depth 1 --branch 3.0.16 --filter=blob:none --sparse https://github.com/videolan/vlc vlc-src
          cd vlc-src
          git sparse-checkout set include
        shell: bash

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build with MinGW
        shell: msys2 {0}
        run: |
          set -e
          VLC_CORE_DLL="/c/Program Files/VideoLAN/VLC/libvlccore.dll"
          gcc -std=gnu11 -Wall -Wextra -O2 -shared -DPIC -DMODULE_STRING=\"st2110\" \
            -I vlc-src/include \
            -o receive-module/libst2110_plugin.dll \
            receive-module/st2110.c \
            "$VLC_CORE_DLL" -lws2_32

      - name: Package
        run: |
          mkdir dist
          copy receive-module\libst2110_plugin.dll dist\
          copy src\st2110_sdp_loader.lua dist\
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-st2110-windows
          path: dist
