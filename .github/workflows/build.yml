name: Build

on:
  push:
  workflow_dispatch:

jobs:
  lint-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luac
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax-check the extension
        run: luac5.1 -p src/st2110_sdp_loader.lua

  build-receive-module:
    runs-on: ubuntu-22.04   # pinned: newer Ubuntu may ship VLC 4.x headers
    steps:
      - uses: actions/checkout@v4
      - name: Install VLC plugin SDK
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libvlccore-dev
      - name: Build
        working-directory: receive-module
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: vlc-st2110-linux
          path: receive-module/libst2110_plugin.so

  build-receive-module-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install VLC 3.0.20 (for libvlccore.dll)
        shell: pwsh
        run: |
          $attempts = 0
          do {
            $attempts++
            choco install vlc --version=3.0.20 -y
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install failed (attempt $attempts), retrying in 30s..."
            Start-Sleep -Seconds 30
          } while ($attempts -lt 5)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch matching VLC 3.0.20 headers
        run: |
          git clone --depth 1 --branch 3.0.20 --filter=blob:none --sparse https://github.com/videolan/vlc vlc-src
          cd vlc-src
          git sparse-checkout set include
        shell: bash

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build with MinGW
        shell: msys2 {0}
        run: |
          set -e
          VLC_CORE_DLL="/c/Program Files/VideoLAN/VLC/libvlccore.dll"
          # -static-libgcc / static winpthread: without these, the DLL
          # dynamically depends on MinGW runtime DLLs (libgcc_s_seh-1.dll,
          # libwinpthread-1.dll) that only exist on a machine with
          # MSYS2/MinGW installed. On a plain Windows box without that dev
          # tooling, VLC fails to load the plugin with "error 126 (module
          # not found)" -- not because libst2110_plugin.dll itself is
          # missing, but because ITS OWN dependency is. libvlccore.dll and
          # ws2_32.dll stay dynamic (they're provided by VLC/Windows
          # itself and always present).
          gcc -std=gnu11 -Wall -Wextra -O2 -shared -DPIC -D__PLUGIN__ -DMODULE_STRING=\"st2110\" \
            -static-libgcc \
            -I vlc-src/include \
            -o receive-module/libst2110_plugin.dll \
            receive-module/st2110.c \
            "$VLC_CORE_DLL" -lws2_32 \
            -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic

      - name: Package
        run: |
          mkdir dist
          copy receive-module\libst2110_plugin.dll dist\
          copy src\st2110_sdp_loader.lua dist\
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-st2110-windows
          path: dist
